    <rect x="76" y="0" width="48" height="200" rx="24" fill="#FFFFFF"/>
    <rect x="0" y="76" width="200" height="48" rx="24" fill="url(#tealGradW)"/>
    <rect x="76" y="76" width="48" height="48" fill="#FFFFFF"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(250, 0)">
    <text x="0" y="140" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="108" letter-spacing="-2" fill="#FFFFFF">MEDIMAX</text>
    <rect x="4" y="168" width="410" height="4" fill="#2BD9C4"/>
    <text x="4" y="205" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" letter-spacing="7" fill="#2BD9C4">SURGICALS</text>
  </g>
</svg>
