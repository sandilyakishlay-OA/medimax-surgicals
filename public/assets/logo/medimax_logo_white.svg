<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2BD9C4"/>
      <stop offset="100%" stop-color="#12A192"/>
    </linearGradient>
  </defs>

  <!-- ICON MARK: white vertical + teal horizontal, for dark backgrounds -->
