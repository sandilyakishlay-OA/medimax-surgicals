<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2E4A"/>
      <stop offset="100%" stop-color="#173F63"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12A192"/>
      <stop offset="100%" stop-color="#0C8074"/>
    </linearGradient>
  </defs>

  <!-- ICON MARK: interlocked cross, navy vertical + teal horizontal -->
  <g transform="translate(20, 40)">
    <!-- vertical bar (navy) -->
    <rect x="76" y="0" width="48" height="200" rx="24" fill="url(#navyGrad)"/>
    <!-- horizontal bar (teal), drawn on top to create the interlock -->
    <rect x="0" y="76" width="200" height="48" rx="24" fill="url(#tealGrad)"/>
    <!-- small notch cut to suggest the navy bar passing back over on the right arm, giving a woven look -->
    <rect x="124" y="76" width="76" height="48" rx="24" fill="url(#tealGrad)"/>
    <rect x="76" y="76" width="48" height="48" fill="url(#navyGrad)"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(250, 0)">
    <text x="0" y="140" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="108" letter-spacing="-2" fill="#123B5E">MEDIMAX</text>
    <!-- thin rule -->
    <rect x="4" y="168" width="410" height="4" fill="#12A192"/>
    <text x="4" y="205" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" letter-spacing="7" fill="#0C8074">SURGICALS</text>
  </g>
</svg>
